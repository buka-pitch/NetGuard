<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetGuard · Password reset</title>
<meta name="theme-color" content="#0a84ff">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-512.png">
<link rel="stylesheet" href="style.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; background: var(--bg); }
  .login-card { width: 100%; max-width: 460px; padding: 28px 32px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel); }
  .login-card h1 { margin: 0 0 4px 0; font-size: 18px; font-weight: 600; }
  .login-card p.subtitle { margin: 0 0 18px 0; color: var(--text-muted); font-size: 12px; }
  .login-card label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-muted); display: block; margin-bottom: 4px; }
  .login-card input { width: 100%; padding: 8px 10px; margin-bottom: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--text); font-size: 13px; font-family: inherit; box-sizing: border-box; }
  .login-card input:focus { outline: none; border-color: var(--accent); }
  .login-card button { width: 100%; padding: 9px; background: var(--accent); color: #fff; border: 0; border-radius: var(--radius-sm); font-size: 13px; cursor: pointer; font-family: inherit; }
  .login-card button:hover { filter: brightness(1.08); }
  .login-card button:disabled { opacity: 0.5; cursor: wait; }
  .login-card .error { background: var(--red-bg); color: var(--red); padding: 8px 10px; border-radius: var(--radius-sm); font-size: 12px; margin-bottom: 12px; display: none; }
  .login-card .pw-rules { color: var(--text-muted); font-size: 11px; margin: -8px 0 12px 0; }
  .login-card code { background: var(--bg); padding: 1px 4px; border-radius: 3px; font-size: 11px; }
  .login-card .links { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-muted); text-align: center; }
  .login-card .links a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<div class="login-card">
  <h1>NetGuard — password reset</h1>
  <p class="subtitle">use the reset token from <code>/var/lib/netmon/password-reset-token</code> on the server</p>
  <div class="error" id="err"></div>
  <form id="reset-form">
    <label for="t">reset token</label>
    <input type="text" id="t" name="reset_token" autocomplete="off" required autofocus>
    <label for="p">new password</label>
    <input type="password" id="p" name="new" autocomplete="new-password" required>
    <p class="pw-rules">12+ characters, must include lower, upper, digit, and symbol.</p>
    <button type="submit" id="btn">set new password</button>
  </form>
  <div class="links"><a href="/login.html">back to login</a></div>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const forced = params.get('forced') === '1';

function show(msg) {
  const el = document.getElementById('err');
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}

document.getElementById('reset-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  btn.disabled = true;
  btn.textContent = 'saving…';
  show('');
  try {
    const r = await fetch('/api/auth/password-reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        reset_token: document.getElementById('t').value,
        new: document.getElementById('p').value,
      }),
    });
    if (!r.ok) {
      const body = await r.text();
      let msg = 'reset failed';
      try { msg = JSON.parse(body).error || msg; } catch (_) {}
      show(msg);
      btn.disabled = false;
      btn.textContent = 'set new password';
      return;
    }
    window.location.href = '/';
  } catch (e) {
    show('network error: ' + e.message);
    btn.disabled = false;
    btn.textContent = 'set new password';
  }
});
</script>
</body>
</html>
